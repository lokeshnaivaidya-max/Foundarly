      <path d="M 160 120 L 350 120 C 365 120 375 132 375 146 C 375 160 365 172 350 172 L 230 172 L 230 230 L 320 230 C 335 230 345 242 345 256 C 345 270 335 282 320 282 L 230 282 L 230 392 C 230 406 218 418 204 418 C 190 418 178 406 178 392 L 178 138 C 178 128 168 120 160 120 Z" fill="url(#foundarly_gold_emblem)"/>
      <circle cx="360" cy="370" r="24" fill="#F5A623"/>
