    <!-- Centralized Canonical Domain Guard: Immediately enforce https://www.foundarlybusinessworld.in -->
    <script>
      (function() {
        try {
          var h = window.location.hostname;
          // Preserve local development and preview runtimes
          if (
            h === 'localhost' ||
            h === '127.0.0.1' ||
            h === '0.0.0.0' ||
            h.slice(-10) === '.localhost' ||
            h.slice(-6) === '.local' ||
            h.slice(-9) === '.internal' ||
            h.slice(-8) === '.run.app'
          ) {
            return;
          }

          // If already on canonical production domain, do nothing!
          if (h === 'www.foundarlybusinessworld.in') {
            return;
          }

          // If accessed via apex domain, Vercel preview domain, or legacy domain, redirect to canonical www domain
          var isApexHost = h === 'foundarlybusinessworld.in';
          var isVercelHost = h === 'foundarly-delta.vercel.app' || h.slice(-11) === '.vercel.app';
          var isLegacyHost = h === 'foundarly.com' || h === 'www.foundarly.com';

          if (isApexHost || isVercelHost || isLegacyHost) {
            var targetOrigin = 'https://www.foundarlybusinessworld.in';
            var currentTarget = targetOrigin + window.location.pathname + window.location.search + window.location.hash;
            window.location.replace(currentTarget);
          }
        } catch (e) {
          // Fail silently and proceed
        }
      })();
    </script>
