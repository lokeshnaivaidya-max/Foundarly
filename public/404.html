<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>404: Page Not Found | foundarly</title>
    <meta name="robots" content="noindex, nofollow" />
    <link rel="icon" type="image/x-icon" href="/favicon.ico" />
    <style>
      * { box-sizing: border-box; margin: 0; padding: 0; }
      body {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        background-color: #0d0e12;
        color: #f3f4f6;
        display: flex;
        align-items: center;
        justify-content: center;
        min-height: 100vh;
        padding: 24px;
        text-align: center;
      }
      .card {
        max-width: 480px;
        padding: 40px 32px;
        border-radius: 16px;
        background: #14151b;
        border: 1px solid rgba(245, 166, 35, 0.2);
        box-shadow: 0 20px 40px rgba(0,0,0,0.5);
      }
      .code {
        font-size: 72px;
        font-weight: 800;
        color: #f5a623;
        line-height: 1;
        margin-bottom: 12px;
      }
      h1 { font-size: 24px; font-weight: 700; margin-bottom: 12px; color: #ffffff; }
      p { font-size: 14px; color: #9ca3af; line-height: 1.6; margin-bottom: 28px; }
      .btn {
        display: inline-block;
        background: #f5a623;
        color: #0d0e12;
        font-weight: 600;
        font-size: 14px;
        padding: 12px 24px;
        border-radius: 8px;
        text-decoration: none;
        transition: opacity 0.2s;
      }
      .btn:hover { opacity: 0.9; }
    </style>
  </head>
  <body>
    <div class="card">
      <div class="code">404</div>
      <h1>Page Not Found</h1>
      <p>The page you requested could not be found. It may have been moved, renamed, or deleted.</p>
      <a href="/" class="btn">Return to Foundarly</a>
    </div>
  </body>
</html>
