  </g>

  <!-- Official Foundarly Wordmark & Subtitle -->
  <text x="76" y="42" font-family="'Playfair Display', Georgia, serif" font-size="31" font-weight="700" fill="url(#foundarly_gold_text)" letter-spacing="-0.3">Foundarly</text>
  <text x="78" y="58" font-family="'Inter', -apple-system, sans-serif" font-size="8.5" font-weight="700" fill="#94A3B8" letter-spacing="3.2">BUSINESS WORLD</text>
