    <!-- Structured Data (JSON-LD) -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "ProfessionalService",
      "name": "foundarly",
      "description": "Expert business consultation and professional consulting services. Connect with verified industry experts for personalized 1-on-1 video consultations.",

      "logo": "https://foundarly.in/logo.png",
      "image": "https://foundarly.in/og-image.jpg",
      "priceRange": "₹₹",
      "telephone": "+91-XXXXXXXXXX",
      "address": {
        "@type": "PostalAddress",

      },

        "https://linkedin.com/company/foundarly",
        "https://facebook.com/foundarly"
      ],
      "aggregateRating": {
        "@type": "AggregateRating",
        "ratingValue": "4.8",
        "reviewCount": "150"
      },
      "offers": {
        "@type": "AggregateOffer",
        "priceCurrency": "INR",
        "lowPrice": "1500",
        "highPrice": "5000",
        "offerCount": "50"
      }
    }
    </script>
    
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "WebSite",
      "name": "foundarly",
      "url": "https://foundarly.in",
      "potentialAction": {
        "@type": "SearchAction",
        "target": "https://foundarly.in/consultants?search={search_term_string}",
        "query-input": "required name=search_term_string"
      }
    }
    </script>
